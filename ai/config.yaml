# AgenticEval AI Pipeline Configuration

ocr:
  engine: "gemini"  # "gemini" | "tesseract"
  language_hints: ["en"]
  dpi: 300

cleaner:
  remove_page_numbers: true
  remove_headers_footers: true
  fix_hyphenation: true

splitter:
  strict_matching: true
  min_answer_length: 10

evaluator:
  model: "gemini-2.0-flash"
  temperature: 0.1
  max_retries: 3
  timeout_seconds: 60

feedback:
  tone: "constructive"  # "constructive" | "encouraging" | "formal"
  include_exemplar: true
  max_length: 500

aggregator:
  consistency_threshold: 0.15

pipeline:
  parallel_evaluation: true
  max_concurrent: 5